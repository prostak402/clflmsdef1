name: Stage Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-smoke
  cancel-in-progress: false

jobs:
  stage-storage-smoke:
    name: Stage storage smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run stage storage smoke
        run: npm run smoke:stage
        env:
          STAGE_API_BASE_URL: ${{ vars.STAGE_API_BASE_URL }}
          STAGE_API_TOKEN: ${{ secrets.STAGE_API_TOKEN }}
          STAGE_SMOKE_CLIP_PREFIX: ${{ vars.STAGE_SMOKE_CLIP_PREFIX }}
