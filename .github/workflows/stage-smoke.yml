name: Stage Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  stage-db-prepare:
    name: Stage DB migrate + seed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run migrations
        run: python3 scripts/db/migrate.py
        env:
          DB_PATH: ./db/stage-ci.sqlite3

      - name: Run seed
        run: python3 scripts/db/seed.py
        env:
          DB_PATH: ./db/stage-ci.sqlite3

  stage-api-smoke:
    name: Stage API smoke
    runs-on: ubuntu-latest
    needs: stage-db-prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run stage API smoke
        run: python3 scripts/db/stage_api_smoke.py
        env:
          STAGE_API_BASE_URL: ${{ vars.STAGE_API_BASE_URL }}
          STAGE_API_TOKEN: ${{ secrets.STAGE_API_TOKEN }}
          STAGE_SMOKE_SAFE_MODE: ${{ vars.STAGE_SMOKE_SAFE_MODE || 'true' }}
          STAGE_SMOKE_CLIP_ID: ${{ vars.STAGE_SMOKE_CLIP_ID }}
